<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>dekomori.cc</title>

  <script>
    const normalTitle = "dekomori";
    const awayTitle = "(╥﹏╥) hey…";

    document.addEventListener("visibilitychange", () => {
      document.title = document.hidden ? awayTitle : normalTitle;
    });
  </script>

  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="/favicon.ico" type="favicon.ico">
</head>

<body>

  <pre></pre>

  <script type="module">
    import { run } from '/src/run.js'
    import * as program from '/src/programs/demos/dekomori.js'

    run(program, {
      element: document.querySelector('pre')
    }).catch(e => console.error(e))
  </script>

</body>
</html>
